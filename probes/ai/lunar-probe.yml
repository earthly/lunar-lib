version: 0

name: ai
description: Agent-time guardrails for AI instruction files. Caps the size of `AGENTS.md` and its siblings at edit time, so the file that steers every future session can't quietly grow past the point where agents stop reading it.
author: earthly

landing_page:
  display_name: "AI Probe"
  long_description: |
    Instruction files only grow — every session appends "one more thing
    a future agent should know" and nothing ever trims. This probe caps
    `AGENTS.md` and its siblings while the agent is editing them, with
    the same thresholds the `ai` policy enforces in CI.
  categories: ["documentation", "authoring"]
  icon: "assets/ai.svg"
  status: "beta"
  related:
    - slug: "ai"
      type: "policy"
      reason: "CI-time instruction-file-length gate; this is its agent-time complement."
    - slug: "ai"
      type: "collector"
      reason: "Collects the instruction-file metrics the CI-time policy gates on."

inputs:
  max_lines:
    description: |
      Maximum line count for a single instruction file. `0` disables the
      line check. Defaults to `300`, matching the `max_lines` input on
      the `ai` policy's `instruction-file-length` check so the
      agent-time and CI-time caps agree.
    default: "300"
  max_bytes:
    description: |
      Maximum byte size for a single instruction file. `0` disables the
      byte check. Defaults to `32768` — the `ai` policy's combined
      budget across all instruction files, applied here per-file so one
      file can't consume the whole allowance on its own.
    default: "32768"

probes:
  - name: instruction-file-size
    description: Block a write that would push an AI instruction file past the line or byte cap. Writes that shrink the file are always allowed.
    keywords: ["agents.md", "claude.md", "instruction file", "context window", "token budget", "size", "cap"]
    hook:
      type: agent-before-file-edit
      paths:
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - "**/GEMINI.md"
        - "**/.github/copilot-instructions.md"
        - "**/.cursor/rules/*.md"
        - "**/.cursor/rules/*.mdc"
    requires:
      - tool: jq
        install_hint: "brew install jq  (or: apt-get install jq / apk add jq)"
    check: scripts/check-instruction-file-size.sh
    message: |-
      This edit would push an AI instruction file past its size cap.

      ```
      {check_stdout}
      ```

      An instruction file that nothing ever trims stops being read: past
      a few hundred lines agents skim it, and every token it spends is a
      token the actual task doesn't get. Before adding more:

      - Does an existing section already cover this? Edit it instead of
        appending a near-duplicate.
      - Is this durable convention, or one task's detail? Task detail
        belongs in the PR or the ticket.
      - Can it move behind a link — a `docs/` page, a sibling
        `AGENTS.md` in the subdirectory it actually governs?

      Trimming is never blocked: any write that makes the file smaller
      goes through even while it's over the cap, so you can bring it
      down incrementally. Raise the ceiling with the `max_lines` /
      `max_bytes` inputs if your team genuinely wants a bigger file.

  - name: instruction-file-size-warn
    description: Soft-nudge alternative to `instruction-file-size` — reports the overage after the edit lands instead of blocking it.
    keywords: ["agents.md", "claude.md", "instruction file", "context window", "token budget", "size", "soft-warn"]
    hook:
      type: agent-after-file-edit
      paths:
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - "**/GEMINI.md"
        - "**/.github/copilot-instructions.md"
        - "**/.cursor/rules/*.md"
        - "**/.cursor/rules/*.mdc"
    requires:
      - tool: jq
        install_hint: "brew install jq  (or: apt-get install jq / apk add jq)"
    check: scripts/check-instruction-file-size.sh
    message: |-
      Heads up: `{file}` is over its size cap.

      ```
      {check_stdout}
      ```

      Trim it before you finish — fold the new content into an existing
      section, or move the detail behind a link. Pick
      `instruction-file-size` instead of this probe in your
      `.lunar/probes.yml` if you want the oversize write rejected
      outright.
