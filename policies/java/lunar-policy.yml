version: 0

name: java
description: Enforces Java project structure and build tool standards
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Java Project Guardrails"
  long_description: |
    Enforce Java-specific project standards including build tool wrappers,
    Java version requirements, Maven/Gradle version minimums, and test scope.
  category: "devex-build-and-ci"
  icon: "assets/java.svg"
  status: "beta"
  requires:
    - slug: "java"
      type: "collector"
      reason: "Provides Java project metadata"
  related:
    - slug: "docker"
      type: "collector"
      reason: "Provides Dockerfile runtime base images for min-java-version-base-image"

policies:
  - name: build-tool-wrapper-exists
    description: |
      Ensures a build tool wrapper exists (mvnw for Maven projects, gradlew for
      Gradle projects). Wrappers ensure reproducible builds without requiring
      a pre-installed build tool.
    mainPython: ./wrapper_exists.py
    keywords: ["maven wrapper", "gradle wrapper", "mvnw", "gradlew", "reproducible builds"]

  - name: min-java-version
    description: |
      Ensures the Java version configured in the build file (pom.xml or
      build.gradle) meets the minimum. Compares full versions, not just the major;
      the update a feature-release target can't show comes from Java recorded in CI.
    mainPython: ./min_java_version.py
    keywords: ["java version", "compatibility", "security", "LTS"]

  - name: min-java-version-cicd
    description: |
      Ensures every Java version recorded for java/javac commands in CI meets the
      minimum. Compares full versions and doesn't need a build file.
    mainPython: ./min_java_version_cicd.py
    keywords: ["java version", "ci/cd", "jdk", "security", "patch level"]

  - name: min-java-version-base-image
    description: |
      Ensures the Java base image of each Dockerfile's runtime (final) stage meets
      the minimum. Floating, major-only or unrecognized tags skip as unknown.
    mainPython: ./min_java_version_base_image.py
    keywords: ["java version", "base image", "dockerfile", "jre", "runtime", "security"]

  - name: min-maven-version
    description: |
      Ensures the Maven version used in CI/CD commands meets the minimum
      requirement. Helps maintain build tool security and compatibility.
    mainPython: ./min_maven_version.py
    keywords: ["maven version", "ci/cd", "build tool", "compatibility"]

  - name: min-gradle-version
    description: |
      Ensures the Gradle version used in CI/CD commands meets the minimum
      requirement. Helps maintain build tool security and compatibility.
    mainPython: ./min_gradle_version.py
    keywords: ["gradle version", "ci/cd", "build tool", "compatibility"]

  - name: tests-all-modules
    description: |
      Ensures tests run across all modules rather than a subset. Prevents
      accidentally skipping tests in multi-module projects.
    mainPython: ./tests_all_modules.py
    keywords: ["java test", "test scope", "all modules", "multi-module"]

inputs:
  min_java_version:
    description: Minimum Java version, as a feature release ("17"), a specific update ("21.0.13.1") or one minimum per feature release ("21.0.13.1, 25.0.5.1, 27.0.1.1")
    default: "17"
  min_java_version_cicd:
    description: Minimum Java version for java/javac commands in CI, in the same forms as min_java_version
    default: "17"
  min_java_version_base_image:
    description: Minimum Java version for runtime base images in Dockerfiles, in the same forms as min_java_version
    default: "17"
  java_base_image_families:
    description: Java base images to check, one per line as a repository pattern and a version scheme (temurin, version, chainguard or distro); a `defaults` line adds the built-in list. Empty uses the built-in list
    default: ""
  min_maven_version:
    description: Minimum required Maven version (e.g., "3.9.0")
    default: "3.9.0"
  min_gradle_version:
    description: Minimum required Gradle version (e.g., "8.0.0")
    default: "8.0.0"
