version: 0

name: k8s
description: Kubernetes configuration and resource policies
author: earthly

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Kubernetes Guardrails"
  long_description: |
    Enforce Kubernetes best practices on plain manifests and rendered Helm charts, including
    manifest validation, resource limits, probes, PodDisruptionBudgets, autoscaling, topology
    spread, graceful shutdown, and NetworkPolicy egress to the instance-metadata endpoint.
  category: "deployment-and-infrastructure"
  icon: "assets/k8s.svg"
  status: "stable"
  requires:
    - slug: "k8s"
      type: "collector"
      reason: "Provides parsed K8s manifest data that these policies evaluate"

policies:
  - name: valid
    description: |
      Validates that all Kubernetes manifests in the repository are syntactically correct
      and conform to K8s schema, and that every Helm chart renders. Invalid manifests will
      fail deployment.
    mainPython: valid.py
    keywords: ["kubernetes", "manifest validation", "yaml", "kubeconform", "helm template"]

  - name: requests-and-limits
    description: |
      Ensures all containers have CPU and memory requests and limits defined.
      Missing resource specs can cause scheduling failures and noisy neighbor issues.
    mainPython: requests_and_limits.py
    keywords: ["resources", "cpu limits", "memory limits", "requests", "qos"]

  - name: probes
    description: |
      Requires liveness and readiness probes on all containers.
      Probes enable Kubernetes to detect unhealthy pods and route traffic correctly.
    mainPython: probes.py
    keywords: ["liveness probe", "readiness probe", "health checks", "pod health"]

  - name: min-replicas
    description: |
      Enforces minimum replica counts on HorizontalPodAutoscalers.
      Ensures services maintain capacity during scaling events and failures.
    mainPython: min_replicas.py
    keywords: ["hpa", "replicas", "high availability", "autoscaling"]

  - name: pdb
    description: |
      Requires PodDisruptionBudgets for Deployments and StatefulSets.
      PDBs protect availability during voluntary disruptions like node drains.
    mainPython: pdb.py
    keywords: ["pdb", "pod disruption budget", "availability", "node drain"]

  - name: non-root
    description: |
      Requires containers to run as non-root users via securityContext.
      Running as root inside containers violates least privilege principles.
    mainPython: non_root.py
    keywords: ["security context", "non-root", "runAsNonRoot", "least privilege"]

  - name: host-users
    description: |
      Requires workload PodSpecs to set `hostUsers: false`. User Namespaces
      (GA in Kubernetes v1.36) map container UIDs to unprivileged host UIDs
      so that a container escape no longer hands the attacker root on the
      node. Complements `non-root` — that check drops privilege inside the
      container; this one isolates UIDs across the kernel boundary. Target
      cluster must be on K8s >=1.36; workloads that legitimately need host
      UIDs (e.g. log shippers reading host paths) can be opted out via
      `include`/`exclude` in `lunar-config.yml`.
    mainPython: host_users.py
    keywords: ["user namespaces", "hostUsers", "container escape", "least privilege", "kernel boundary"]

  - name: host-network
    description: |
      Fails when workload PodSpecs set `hostNetwork: true`. Sharing the host's
      network namespace bypasses NetworkPolicy enforcement, exposes node-local
      services to the pod, and gives a compromised container direct access to
      the node's interfaces (and any cleartext traffic on them). Legitimate
      hostNetwork users (CNI agents, node-local proxies, host-bound exporters)
      can opt out via `include`/`exclude` in `lunar-config.yml`.
    mainPython: host_network.py
    keywords: ["hostNetwork", "network namespace", "NetworkPolicy bypass", "container escape", "least privilege"]

  - name: host-pid
    description: |
      Fails when workload PodSpecs set `hostPID: true`. Sharing the host's
      PID namespace lets the container see, signal, and (with the right
      capabilities) attach to every process on the node, undermining process
      isolation and aiding lateral movement after a container compromise.
      Workloads that need it (e.g. node-level monitoring agents) can opt out
      via `include`/`exclude` in `lunar-config.yml`.
    mainPython: host_pid.py
    keywords: ["hostPID", "PID namespace", "process isolation", "container escape", "least privilege"]

  - name: host-ipc
    description: |
      Fails when workload PodSpecs set `hostIPC: true`. Sharing the host's
      IPC namespace exposes node-wide System V IPC and POSIX shared memory
      to the container, which can be abused to read or tamper with other
      workloads' shared-memory state. Workloads that genuinely need host IPC
      can opt out via `include`/`exclude` in `lunar-config.yml`.
    mainPython: host_ipc.py
    keywords: ["hostIPC", "IPC namespace", "shared memory", "container escape", "least privilege"]

  - name: metadata-egress-blocked
    description: |
      Requires a NetworkPolicy to keep each workload's pods from reaching the
      cloud instance-metadata endpoint (169.254.169.254), where node credentials
      can be read.
    mainPython: metadata_egress_blocked.py
    keywords: ["NetworkPolicy", "egress", "instance metadata", "IMDS", "169.254.169.254", "credential theft"]

  - name: min-kubectl-version
    description: |
      Ensures the kubectl version used in CI meets the minimum required version.
      Old kubectl clients may miss security fixes or lack support for current cluster APIs.
    mainPython: min_kubectl_version.py
    keywords: ["kubectl", "version", "ci/cd", "compatibility", "security"]

  - name: topology-spread
    description: |
      Requires Deployments and StatefulSets that can run more than one replica to have a
      topologySpreadConstraint on `topology_key` (zone by default) that selects their pods,
      with maxSkew within `topology_max_skew`.
    mainPython: topology_spread.py
    keywords: ["topology spread", "availability zones", "maxSkew", "pod placement", "high availability"]

  - name: graceful-shutdown
    description: |
      Requires Deployments and StatefulSets to drain before stopping: a preStop hook on a container
      and a terminationGracePeriodSeconds of at least `min_termination_grace_period_seconds`.
    mainPython: graceful_shutdown.py
    keywords: ["graceful shutdown", "preStop", "terminationGracePeriodSeconds", "SIGTERM", "zero-downtime deploys"]

  - name: pdb-budget
    description: |
      Fails a PodDisruptionBudget that allows no voluntary disruption, which blocks node drains:
      maxUnavailable 0, or minAvailable at or above the replicas it covers. Also fails one with no
      selector, or with both minAvailable and maxUnavailable set.
    mainPython: pdb_budget.py
    keywords: ["pdb", "pod disruption budget", "node drain", "maxUnavailable", "minAvailable"]

  - name: no-static-replicas
    description: |
      Fails a Deployment or StatefulSet that sets spec.replicas while an HPA or KEDA ScaledObject
      scales it: every apply resets the replica count the autoscaler chose.
    mainPython: no_static_replicas.py
    keywords: ["hpa", "keda", "autoscaling", "spec.replicas", "argocd sync", "helm upgrade"]

  - name: probes-distinct
    description: |
      Requires each container's liveness and readiness probes to check different endpoints, so a
      pod too busy to serve leaves rotation instead of being restarted.
    mainPython: probes_distinct.py
    keywords: ["liveness probe", "readiness probe", "health checks", "probe endpoints"]

  - name: probe-timeouts
    description: |
      Requires every probe's timeoutSeconds to be at least `min_probe_timeout_seconds` and below
      its periodSeconds, so one slow check isn't still running when the next starts.
    mainPython: probe_timeouts.py
    keywords: ["probe timeout", "timeoutSeconds", "periodSeconds", "health checks", "pod restarts"]

  - name: allowed-registries
    description: |
      Requires every container and init container image to come from a registry in
      `allowed_registries`. Skipped until the list is set.
    mainPython: allowed_registries.py
    keywords: ["container registry", "image source", "supply chain security", "approved registries"]

  - name: deprecated-api-versions
    description: |
      Fails manifests and rendered charts that use an apiVersion listed in
      `deprecated_api_versions`. Skipped until the list is set.
    mainPython: deprecated_api_versions.py
    keywords: ["deprecated apis", "apiVersion", "kubernetes upgrade", "removed apis"]

  - name: pod-annotations
    description: |
      Requires the pod template annotations in `required_pod_annotations` and fails those in
      `forbidden_pod_annotations`. Skipped until either list is set.
    mainPython: pod_annotations.py
    keywords: ["pod annotations", "required annotations", "forbidden annotations", "karpenter"]

inputs:
  min_replicas:
    description: Minimum replicas required for HPAs (default 3)
    default: "3"
  max_limit_to_request_ratio:
    description: Maximum ratio of limits to requests for CPU/memory (default 4)
    default: "4"
  min_kubectl_version:
    description: Minimum kubectl version required in CI (semver, e.g. "1.28")
    default: "1.28"
  metadata_ips:
    description: Comma-separated metadata endpoint IPs that metadata-egress-blocked keeps pods from reaching on TCP port 80 (add fd00:ec2::254 for IPv6 EKS clusters)
    default: "169.254.169.254"
  topology_key:
    description: Node label topology-spread requires a constraint on (default topology.kubernetes.io/zone)
    default: "topology.kubernetes.io/zone"
  topology_max_skew:
    description: Largest maxSkew topology-spread accepts on that constraint (default 1)
    default: "1"
  topology_when_unsatisfiable:
    description: whenUnsatisfiable value topology-spread requires on that constraint (DoNotSchedule or ScheduleAnyway). Empty accepts either.
    default: ""
  topology_require_match_label_keys:
    description: Also require the constraint to set matchLabelKeys with pod-template-hash, so a rollout's skew counts only the new revision's pods (true/false)
    default: "false"
  min_termination_grace_period_seconds:
    description: Smallest terminationGracePeriodSeconds graceful-shutdown accepts. An unset value counts as the Kubernetes default, 30 (default 30)
    default: "30"
  require_prestop:
    description: Whether graceful-shutdown requires a preStop hook on at least one container (true/false)
    default: "true"
  min_probe_timeout_seconds:
    description: Smallest probe timeoutSeconds probe-timeouts accepts. An unset value counts as the Kubernetes default, 1 (default 1)
    default: "1"
  allowed_registries:
    description: Comma-separated registries, or registry/path prefixes, images may come from (e.g. "ghcr.io/acme,123456789012.dkr.ecr.us-east-1.amazonaws.com"). An image with no registry counts as docker.io. Empty skips allowed-registries.
    default: ""
  deprecated_api_versions:
    description: Comma-separated apiVersions deprecated-api-versions fails, each optionally narrowed to one kind (e.g. "policy/v1beta1,networking.k8s.io/v1beta1:Ingress"). Empty skips the check.
    default: ""
  required_pod_annotations:
    description: Comma-separated annotation keys every workload's pod template must set. Empty requires none.
    default: ""
  forbidden_pod_annotations:
    description: Comma-separated annotation keys no workload's pod template may set (e.g. "karpenter.sh/do-not-disrupt"). Empty forbids none.
    default: ""

