version: 0

name: backstage
description: Enforce Backstage service catalog standards
author: earthly
default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Backstage Guardrails"
  long_description: |
    Validates Backstage catalog-info.yaml entries for completeness and
    compliance: the catalog file exists and is valid, owner, lifecycle and
    system are set, and entity references tagged onto infrastructure
    resolve in the catalog. Optionally skips components with no catalog
    file instead of failing them.
  category: "repository-and-ownership"
  icon: "assets/backstage.svg"
  status: "beta"
  requires:
    - slug: "backstage"
      type: "collector"
      reason: "Provides .catalog.native.backstage metadata and resolved .catalog.entity_refs"

policies:
  - name: catalog-info-exists
    description: |
      Verifies that a catalog-info.yaml file exists in the repository.
      Every Backstage-managed service must have a catalog definition file.
      Fails if the `backstage` collector reports no catalog file found.
    mainPython: ./catalog-info-exists.py
    keywords: ["backstage", "catalog-info", "service catalog", "file exists"]

  - name: catalog-info-valid
    description: |
      Verifies that the catalog-info.yaml file is syntactically valid and
      passes Backstage descriptor schema checks (no lint errors reported
      by the collector). Fails if the file is missing or has lint errors.
    mainPython: ./catalog-info-valid.py
    keywords: ["backstage", "catalog-info", "lint", "schema", "validation"]

  - name: owner-set
    description: |
      Validates that the owner field (spec.owner) is populated in the
      catalog-info.yaml. Ownership is required for incident routing
      and accountability. Fails if no catalog file is present.
    mainPython: ./owner-set.py
    keywords: ["backstage", "ownership", "owner", "accountability"]

  - name: lifecycle-set
    description: |
      Validates that the lifecycle stage (spec.lifecycle) is defined in
      the catalog-info.yaml. Lifecycle stages (production, experimental,
      deprecated) inform operational expectations and SLO requirements.
      Fails if no catalog file is present.
    mainPython: ./lifecycle-set.py
    keywords: ["backstage", "lifecycle", "production", "deprecated"]

  - name: system-set
    description: |
      Validates that the system grouping (spec.system) is defined in
      the catalog-info.yaml. System assignment enables dependency mapping
      and architectural visibility. Fails if no catalog file is present.
    mainPython: ./system-set.py
    keywords: ["backstage", "system", "grouping", "architecture"]

  - name: domain-exists
    description: |
      Verifies that the domain referenced by spec.domain in catalog-info.yaml
      actually exists in the Backstage catalog (referential integrity). Reads
      the collector's lookup result at `.catalog.native.backstage.refs.domain`.
      Fails when the declared domain is absent from Backstage (collector
      recorded exists=false). Passes when no domain is declared (nothing to
      cross-check — `system-set`/`*-set` own "should it be set"). Skips (passes)
      when referential integrity was not performed — i.e. the `backstage`
      collector is not configured with `backstage_url` (no `.refs.checked`), or
      the lookup errored transiently (`.refs.domain.error`) — so an unconfigured
      collector or a Backstage outage never turns this red. Note `spec.domain`
      lives on `System` entities, so this check does work only for `kind: System`
      catalog files (or Components carrying a custom domain).
    mainPython: ./domain-exists.py
    keywords: ["backstage", "domain", "referential integrity", "catalog", "cross-reference"]

  - name: system-exists
    description: |
      Verifies that the system referenced by spec.system in catalog-info.yaml
      actually exists in the Backstage catalog (referential integrity). Reads
      the collector's lookup result at `.catalog.native.backstage.refs.system`.
      Fails when the declared system is absent from Backstage (collector
      recorded exists=false). Passes when no system is declared (nothing to
      cross-check — `system-set` owns "should it be set"). Skips (passes) when
      referential integrity was not performed — i.e. the `backstage` collector
      is not configured with `backstage_url` (no `.refs.checked`), or the lookup
      errored transiently (`.refs.system.error`) — so an unconfigured collector
      or a Backstage outage never turns this red.
    mainPython: ./system-exists.py
    keywords: ["backstage", "system", "referential integrity", "catalog", "cross-reference"]

  - name: system-valid
    description: |
      Checks spec.system in two steps and fails at the first broken one: it
      is not set, or it does not resolve to a System in the Backstage catalog.
      One check for what `system-set` and `system-exists` report separately.
      Fails if the catalog file is missing, like `system-set`. Skips when
      spec.system is set but can't be looked up: the collector has no
      `backstage_url`, or the lookup errored.
    mainPython: ./system-valid.py
    keywords: ["backstage", "system", "referential integrity", "catalog", "grouping"]

  - name: system-domain-exists
    description: |
      Verifies that the domain the component's system belongs to actually
      exists in the Backstage catalog (transitive referential integrity).
      Reads the collector's lookup result at
      `.catalog.native.backstage.refs.system_domain`.
      In the Backstage model a Component has no domain of its own — domain
      membership is carried by its System (`System.spec.domain`) — so this is
      the check that answers "is my domain real?" for an ordinary
      `kind: Component` catalog file, where `domain-exists` has nothing to
      inspect. Fails when the system's domain is absent from Backstage,
      naming the offending System (the entity to fix is the System's own
      catalog file, typically owned by another team, not this component's).
      Passes when there is nothing to cross-check — no `spec.system` declared,
      the system itself did not resolve (that is `system-exists`'s failure to
      report), or the system belongs to no domain (that is
      `system-domain-set`'s). Skips (passes) when
      referential integrity was not performed — the `backstage` collector is
      not configured with `backstage_url` (no `.refs.checked`) — or the lookup
      errored transiently (`.refs.system_domain.error`), so an unconfigured
      collector or a Backstage outage never turns this red.
    mainPython: ./system-domain-exists.py
    keywords: ["backstage", "domain", "system", "referential integrity", "catalog", "cross-reference", "transitive"]

  - name: system-domain-set
    description: |
      Verifies that the system the component belongs to is itself assigned to
      a domain (`System.spec.domain`), read from the collector's
      `.catalog.native.backstage.refs.system.has_domain`. Fails when the
      system resolves in Backstage but declares no domain, naming the System
      to fix. Skips when there is no System to check: no `spec.system` is
      declared, or the system does not resolve (`system-set` and
      `system-exists` report those). Also skips when the collector has no
      `backstage_url`, the system lookup errored, or the collector predates
      `has_domain`.
    mainPython: ./system-domain-set.py
    keywords: ["backstage", "domain", "system", "referential integrity", "catalog", "transitive", "domain assignment"]

  - name: system-domain-valid
    description: |
      Follows spec.system to its System in the Backstage catalog and on to
      that System's domain, and fails at the first broken step: the System
      does not exist, it belongs to no domain, or its domain does not exist.
      Each failure names the System. One check for what `system-exists`,
      `system-domain-set` and `system-domain-exists` report separately.
      Fails if the catalog file is missing, like `system-set`. Skips when no
      `spec.system` is declared (`system-set` reports that), when the
      collector has no `backstage_url`, or when a lookup errored.
    mainPython: ./system-domain-valid.py
    keywords: ["backstage", "domain", "system", "referential integrity", "catalog", "transitive", "domain assignment"]

  - name: entity-ref-valid
    description: |
      Fails when an entity reference tagged onto an infrastructure resource is
      malformed or doesn't exist in Backstage, naming the resources that carry
      it. Skips until `.catalog.entity_refs` is collected, and skips references
      that hit a lookup error or are unresolved Terraform expressions.
    mainPython: ./entity-ref-valid.py
    keywords: ["backstage", "entity_ref", "referential integrity", "terraform", "iac", "tags", "catalog"]

  - name: required-annotations
    description: |
      Verifies that catalog-info.yaml declares a configurable set of
      required annotation keys (e.g. backstage.io/source-location), and
      optionally that their values satisfy typed constraints — a declared
      data type (integer, number, boolean, string) with numeric bounds,
      string length, a regular-expression pattern, or an allowed-value
      set. Configure via the `required_annotations` input. Skipped when no
      annotations are required (the default). Fails if the catalog file is
      missing, a required key is absent or empty, or a value violates its
      declared constraint.
    mainPython: ./required-annotations.py
    keywords: ["backstage", "annotations", "metadata", "required", "type validation", "value constraints"]

  - name: required-tag-patterns
    description: |
      Verifies that catalog-info.yaml carries at least one tag matching
      each configured glob pattern (e.g. `location/*`, `runs-on/*`).
      Configure via the `required_tag_patterns` input. Skipped when no
      patterns are required (the default). Fails if the catalog file is
      missing or any pattern is unmatched by the component's tags.
    mainPython: ./required-tag-patterns.py
    keywords: ["backstage", "tags", "tag patterns", "glob", "required", "metadata"]

  - name: required-link-types
    description: |
      Verifies that catalog-info.yaml has a `metadata.links` entry of each
      configured link type (e.g. `runbook`, `dashboard`), matched exactly on
      the link's `type`. Configure via the `required_link_types` input.
      Skipped when no link types are required (the default). Fails if the
      catalog file is missing or any required type has no link.
    mainPython: ./required-link-types.py
    keywords: ["backstage", "links", "link type", "runbook", "dashboard", "required", "metadata"]

  - name: disallowed-annotations
    description: |
      Verifies that catalog-info.yaml declares none of a configurable set
      of forbidden annotation keys. Configure via the
      `disallowed_annotations` input. Skipped when no annotations are
      forbidden (the default). Fails if any forbidden annotation key is
      present in `metadata.annotations`.
    mainPython: ./disallowed-annotations.py
    keywords: ["backstage", "annotations", "metadata", "disallowed", "forbidden"]

  - name: disallowed-tag-patterns
    description: |
      Verifies that none of the component's tags match a configured glob
      pattern. Configure via the `disallowed_tag_patterns` input. Skipped
      when no patterns are forbidden (the default). Fails if any tag
      matches any forbidden pattern.
    mainPython: ./disallowed-tag-patterns.py
    keywords: ["backstage", "tags", "tag patterns", "glob", "disallowed", "forbidden"]

  - name: dependencies-documented
    description: |
      Verifies that catalog-info.yaml declares the component's dependencies:
      a non-empty `spec.dependsOn`, or a non-empty comma-separated value in
      the annotation named by the `dependencies_annotation` input. Targets
      are not looked up in the catalog. Skipped unless `require_dependencies`
      is `"true"`. Fails if the catalog file is missing or declares no
      dependencies.
    mainPython: ./dependencies-documented.py
    keywords: ["backstage", "dependencies", "dependsOn", "dependency mapping", "metadata"]

  - name: allowed-types
    description: |
      Verifies that catalog-info.yaml `spec.type` is one of the values in the
      `allowed_types` input (e.g. `service,website,library`), matched exactly
      and case-sensitively. Skipped when no types are configured (the
      default). Fails if the catalog file is missing, or `spec.type` is
      missing or not in the list.
    mainPython: ./allowed-types.py
    keywords: ["backstage", "type", "spec.type", "allowed values", "taxonomy"]

  - name: allowed-lifecycles
    description: |
      Verifies that catalog-info.yaml `spec.lifecycle` is one of the values in
      the `allowed_lifecycles` input (e.g. `production,experimental`), matched
      exactly and case-sensitively. Skipped when no lifecycles are configured
      (the default), and when `spec.lifecycle` is missing, which
      `lifecycle-set` reports. Fails if the catalog file is missing or the
      value is not in the list.
    mainPython: ./allowed-lifecycles.py
    keywords: ["backstage", "lifecycle", "spec.lifecycle", "allowed values", "taxonomy"]

inputs:
  skip_when_no_catalog_info:
    description: |
      Skip every check in this policy on a component with no catalog-info.yaml,
      instead of failing it. Set to `"true"` when only some repositories in
      scope are registered in Backstage, so importing the policy broadly does
      not turn the rest red.

      One switch for the whole family, and the only place their missing-file
      behaviour is described. With the default (`"false"`) a missing catalog
      file fails `catalog-info-exists`, `catalog-info-valid`, `owner-set`,
      `lifecycle-set`, `system-set` and `system-domain-valid`; fails
      `required-annotations`, `required-tag-patterns`, `required-link-types`,
      `dependencies-documented`, `allowed-types` and `allowed-lifecycles`
      when those are configured; passes the two
      `disallowed-*` deny-checks, since nothing forbidden can be present
      without a file; and skips the other referential-integrity checks, which
      have nothing to cross-check. With `"true"` every check skips instead —
      the `disallowed-*` pair included, so a component that is not in the
      catalog reports no green passes it did not earn.

      Only the file's absence is affected: a component that has a
      catalog-info.yaml is held to every check either way.
      `entity-ref-valid` doesn't read the file, so this doesn't affect it.
    default: "false"
  entity_ref_kind:
    description: |
      When set, `entity-ref-valid` fails references whose `kind`, as the
      collector looked it up, isn't this one (e.g. `component`). Empty (the
      default) accepts any kind.
    default: ""
  required_annotations:
    description: |
      Annotation keys that must be present (and non-empty) in
      catalog-info.yaml `metadata.annotations`. Two forms are accepted.

      Comma-separated keys (presence-only, unchanged), e.g.
      `backstage.io/source-location,pagerduty.com/integration-key`.

      Or a YAML list, where each entry is either a bare key (presence-only)
      or a mapping with a `key` and optional value constraints: `type`
      (string|integer|number|boolean, default string), `min`/`max`
      (integer/number bounds), `min_length`/`max_length` (string length),
      `pattern` (full-match regex), and `enum` (allowed values). For
      example, a `key: example.com/service-tier` with `type: integer`,
      `min: 0`, `max: 5` requires that annotation to parse as an integer
      in 0–5.

      Annotation values are strings in Backstage, so `type` validates that
      the value *parses* as the declared type (`"2"` satisfies `integer`,
      `"2.5"` does not). `enum` inherits `type`: its entries are coerced to
      the declared type before comparison, so `type: integer` with
      `enum: [1,2,3]` compares integers while the default `type: string`
      compares strings. Constraints must match the declared type (`min`/`max`
      for integer/number; `min_length`/`max_length`/`pattern` for string). A
      value that violates a constraint fails the check; a malformed
      constraint (unknown type, min greater than max, invalid regex, a
      constraint on the wrong type, or an enum entry not of the declared
      type) makes it error. Empty (the default) disables the check.
    default: ""
  required_tag_patterns:
    description: |
      Comma-separated list of glob patterns; the component's
      `metadata.tags` must include at least one tag matching each
      pattern. Example: `location/*,runs-on/*`. Matching is
      case-insensitive. Empty (the default) disables the
      `required-tag-patterns` check.
    default: ""
  required_link_types:
    description: |
      Comma-separated list of link types; catalog-info.yaml
      `metadata.links` must include an entry whose `type` is each of them.
      Example: `runbook,dashboard`. Matching is exact and case-sensitive,
      and only the `type` is compared, not the link's title or URL. Empty
      (the default) disables the `required-link-types` check.
    default: ""
  disallowed_annotations:
    description: |
      Comma-separated list of annotation keys that must NOT be present in
      catalog-info.yaml `metadata.annotations`. Example:
      `backstage.io/skip-checks`. Empty (the default) disables the
      `disallowed-annotations` check.
    default: ""
  disallowed_tag_patterns:
    description: |
      Comma-separated list of glob patterns; the component's
      `metadata.tags` must NOT include any tag matching these patterns.
      Example: `deprecated/*,internal-only`. Matching is case-insensitive.
      Empty (the default) disables the `disallowed-tag-patterns` check.
    default: ""
  require_dependencies:
    description: |
      Set to `"true"` to enforce `dependencies-documented`. Off by default,
      so importing the whole policy doesn't fail every component that
      declares no dependencies.
    default: "false"
  dependencies_annotation:
    description: |
      Annotation key that also counts as declared dependencies when its
      value is a non-empty comma-separated list, for catalogs that record
      dependencies there instead of in `spec.dependsOn`. Example:
      `example.com/dependencies`. Empty (the default) checks
      `spec.dependsOn` only.
    default: ""
  allowed_types:
    description: |
      Comma-separated list of allowed `spec.type` values. Example:
      `service,website,library`. Matching is exact and case-sensitive, and
      applies to the primary entity whatever its kind, so an `API` entity's
      type (e.g. `openapi`) needs listing too. Empty (the default) disables
      the `allowed-types` check.
    default: ""
  allowed_lifecycles:
    description: |
      Comma-separated list of allowed `spec.lifecycle` values. Example:
      `production,experimental,deprecated`. Matching is exact and
      case-sensitive. Empty (the default) disables the `allowed-lifecycles`
      check.
    default: ""
