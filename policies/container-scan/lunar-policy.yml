version: 0

name: container-scan
description: Container image vulnerability scanning policies
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Container Scan Guardrails"
  long_description: |
    Enforces container image vulnerability scanning standards. Ensures container scanners
    run and validates vulnerability thresholds for container security.
  category: "security-and-compliance"
  icon: "assets/container-scan.svg"
  status: "stable"
  requires:
    - slug: "docker"
      type: "collector"
      reason: "Provides container definitions used as the applicability gate"
    - slug: "snyk"
      type: "collector"
      reason: "Provides container scan results via Snyk Container"
  related: []

policies:
  - name: executed
    description: |
      Verifies that container scanning was executed on the component.
      Fails if no scanner has written to .container_scan.
    mainPython: executed.py
    keywords: ["container", "security", "scanning", "compliance", "docker", "image"]

  - name: max-severity
    description: |
      Ensures no findings at or above the configured severity threshold.
      Configure min_severity to set the threshold (critical, high, medium, low).
    mainPython: max_severity.py
    keywords: ["container", "critical", "high", "vulnerabilities", "security", "docker"]

  - name: max-total
    description: |
      Ensures total container vulnerabilities are under a configurable threshold.
    mainPython: max_total.py
    keywords: ["container", "threshold", "vulnerabilities", "docker"]

inputs:
  min_severity:
    description: "Minimum severity to fail on (critical, high, medium, low)"
    default: "high"
  ignore_unfixable:
    description: "Only fail max-severity on findings that have a fix available. Unfixable findings are still reported in the component JSON."
    default: "false"
  exempt_findings:
    description: |
      Vulnerabilities `max-severity` ignores because the risk was reviewed and
      accepted. Entries are `<id> <package>@<version>`, optionally followed by
      image globs, separated by newlines or commas:

      ```yaml
      with:
        exempt_findings: |
          # bundled inside a vendor tool that hasn't shipped urllib3 2.8.0
          CVE-2026-97687 urllib3@2.7.0 registry.example.com/tools:*
      ```

      Id, package and version must match the finding exactly (the id ignores
      case), so an entry stops matching once the package is upgraded. With
      globs, only findings in a matching image are exempt, and a finding with no
      recorded image never is. `#` comments are ignored.

      Exempt findings stay in the component JSON. The check still fails on the
      rest, and resolves to `skip`, naming the entries that matched, only when
      every finding that would have failed was exempt. An entry that cannot be
      parsed fails the check without exempting anything. `max-total` ignores
      this input.
    default: ""
  max_total_threshold:
    description: "Maximum total findings allowed (must be configured)"
