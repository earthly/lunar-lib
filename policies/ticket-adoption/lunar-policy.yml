version: 0

name: ticket-adoption

description: Score a component on the share of its recent pull requests that referenced a ticket

author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Ticket Adoption Guardrails"
  long_description: |
    Score a component on the share of its recent pull requests that referenced an
    issue-tracker ticket. Evaluated on the default branch, so change-management adoption
    counts toward initiative and domain scores instead of only appearing on individual
    pull requests.
  category: "security-and-compliance"
  icon: "assets/ticket-adoption.svg"
  status: "beta"
  requires:
    - slug: "ticket-adoption"
      type: "collector"
      reason: "Records the percentage this policy scores"

  related:
    - slug: "ticket"
      type: "policy"
      reason: "Checks one pull request; this scores the trend across many"

policies:
  - name: ticket-adoption
    description: |
      Asserts that at least `min_percentage` of the component's pull requests in the
      trailing window referenced a ticket, reading `.vcs.ticket_adoption` from the
      ticket-adoption collector.
      Skips when there is no adoption data yet, and when the window contains no pull
      requests at all — a component with no recent change should not be reported as
      failing a change-management control.
    mainPython: ./ticket_adoption.py
    keywords: ["ticket", "change management", "adoption", "jsox", "sox"]

inputs:
  min_percentage:
    description: >-
      Minimum percentage of pull requests in the window that must reference a ticket.
    default: "80"
