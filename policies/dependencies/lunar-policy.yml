version: 0

name: dependencies
description: Dependency version, registry provenance, and security policies
author: earthly

default_image: earthly/lunar-lib:policy-dependencies-v1.14.3

landing_page:
  display_name: "Dependency Guardrails"
  long_description: |
    Enforce dependency version requirements and registry provenance. Ensure libraries meet
    minimum safe versions, and that packages resolve only from registries you approve rather
    than straight from public indexes.
  category: "security-and-compliance"
  icon: "assets/dependencies.svg"
  status: "stable"
  requires:
    - slug: "golang"
      type: "collector"
      reason: "Provides Go module dependency data"
    - slug: "package-registries"
      type: "collector"
      reason: "Provides the resolved package registries per ecosystem"
  related: []

policies:
  - name: min-versions
    description: |
      Ensures dependencies meet minimum safe version requirements.
      Validates that project dependencies are at or above specified versions
      to enforce security patches and compatibility standards.
    mainPython: ./min_versions.py
    keywords: ["dependency versions", "minimum version", "security", "semver"]

  - name: approved-registries
    description: |
      Restricts dependency resolution to an approved list of package registries.
      Catches projects that pull from a public index instead of the organization's
      registry, including projects that never configured a registry at all.
    mainPython: ./approved_registries.py
    keywords: ["package registry", "approved registry", "registry allowlist", "supply chain security", "registry provenance"]

  - name: no-public-registries
    description: |
      Requires that no dependency resolves from a well-known public package index
      (npm, PyPI, Maven Central, RubyGems, NuGet). Needs no configuration — use it
      when every package must come through an internal registry or proxy.
    mainPython: ./no_public_registries.py
    keywords: ["public registry", "npmjs", "pypi", "maven central", "registry proxy", "supply chain security"]

inputs:
  language:
    description: Programming language to check (e.g., "go", "java", "python", "nodejs")
    default: ""
  min_versions:
    description: 'JSON object mapping dependency paths to minimum safe versions (e.g., {"github.com/example/lib": "1.0.0"})'
    default: "{}"
  include_indirect:
    description: 'Whether to also check indirect (transitive) dependencies'
    default: "false"
  allowed_registries:
    description: Comma-separated list of allowed package registry hosts (e.g. "dl.cloudsmith.io")
    default: ""
