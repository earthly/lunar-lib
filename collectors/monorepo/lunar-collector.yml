version: 0

name: monorepo
description: Distributes repo-scoped scan results to a monorepo's subcomponents
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Monorepo Collector"
  long_description: |
    A repo-wide scanner like CodeQL default setup reports findings against the
    repository, so in a monorepo they land on the repo-root component and every
    subdirectory component reads as unscanned. Enabled on the root, this
    collector redistributes those findings to the subcomponents by file path.
  category: "security"
  icon: "assets/monorepo.svg"
  status: "beta"
  related:
    - slug: "codeql"
      type: "collector"
      reason: "Produces the repo-wide SAST findings this collector redistributes"
    - slug: "sast"
      type: "policy"
      reason: "Evaluates the per-subcomponent findings this collector writes"

collectors:
  - name: sast-fanout
    description: |
      Redistributes a monorepo's repo-wide SAST findings to its subcomponents.
      Runs on the repository ROOT component once its collection settles, reads
      the path-tagged findings a scanner already produced (.sast.issues), and
      writes each subcomponent's severity counts onto that subcomponent's
      Component JSON at the same commit. `.sast.native` is NEVER copied: the raw
      SARIF describes the whole repository, so it stays on the root, and each
      subcomponent gets only the derived numbers its policies read plus
      provenance under `.sast.source.fanout`. Subcomponents are discovered with a
      prefix-scoped query against the Hub's SQL API (`public.catalog_latest`), so
      only the matching rows cross the wire rather than the entire catalog, or
      pinned with the `subcomponents` input; a finding is attributed when
      its file matches that subcomponent's path patterns — the explicit `paths:`
      plus the implicit "<subdir>/*" its name implies — so attribution follows
      the same rule the Hub uses for change detection. Findings matching no
      subcomponent stay on the root, and a subcomponent that already has SAST
      data of its own is never overwritten, since a per-service scan is more
      precise than a repo-wide one. Hooked on .sast.issues rather than .sast
      because the CodeQL CLI collector writes .sast.native.codeql.cicd for every
      codeql exec (database init, resolve languages, bundle, cleanup), so .sast
      is present long before any findings are; .sast.issues appears only once a
      SARIF report has been parsed. Note that the root component also needs at
      least one POLICY: an after-json collector is dispatched by the Hub's
      doneness gate, which is only consulted while bundling a component's
      policies, so a component no policy evaluates never fires them. See the
      README for the full walkthrough.
    mainBash: sast-fanout.sh
    hook:
      type: after-json
      path: .sast.issues
    keywords: ["monorepo", "sast", "codeql", "fan-out", "after-json", "subcomponent", "cross-component"]

inputs:
  include_issues:
    description: |
      Also write the per-finding array (`.sast.issues`) to each subcomponent,
      sliced to the findings that component owns. Off by default: `policies/sast`
      reads `.sast.summary.has_<sev>` and `.sast.findings.<sev>`, and `max-total`
      reads `.sast.findings.total` — none of them read `.sast.issues`, so
      shipping it multiplies write size by findings x subcomponents for data no
      guardrail evaluates. Turn it on if you want the per-finding detail visible
      on each service in the UI.
    default: "false"
  subcomponents:
    description: |
      Comma-separated list of subcomponent names to fan out to, e.g.
      "github.com/acme/repo/services/api,github.com/acme/repo/services/web".
      Skips SQL discovery entirely — useful when collectors cannot reach the
      Hub's SQL API, or to restrict the fan-out to a subset. Default (empty)
      discovers every component whose name is prefixed by the root's.
      NOTE: it also skips reading each target's explicit `paths:`. Attribution
      then falls back to the implicit "<subdir>/*" a component's name implies,
      so a subcomponent that claims files outside its own directory (a shared
      `.github/workflows/ci.yml`, a root `CODEOWNERS`) will NOT receive findings
      from them. Prefer automatic discovery unless you have a reason not to.
    default: ""
  read_retry_seconds:
    description: |
      How long to keep retrying the Hub reads before failing the run, in
      seconds. The after-json wave fires when COLLECTION settles, but
      `lunar component get-json` reads through views over `mat.components` /
      `mat.component_json`, which the Hub drains asynchronously. A SHA-pinned
      read therefore returns NotFound until this commit's row has drained —
      measured at 210s on a busy Hub. Raise it if your Hub materializes slowly;
      the run holds a wave slot while it waits. On expiry the collector exits
      non-zero rather than silently writing nothing, because the wave is
      fire-once and a swallowed read loses that commit's fan-out permanently.
    default: "300"
  max_subcomponents:
    description: |
      Upper bound on how many subcomponents a single run will write to, as a
      guard against a mis-scoped root component fanning out across an entire
      org. Targets beyond the limit are skipped and logged as a warning (never
      silently dropped).
    default: "50"

# What a SUBCOMPONENT receives. Note there is no `.native` — the raw SARIF stays
# on the repository-root component. `issues` shown here is the opt-in slice
# (include_issues: "true"); by default only findings/summary/source are written.
example_component_json: |
  {
    "sast": {
      "source": {
        "tool": "codeql",
        "version": "2.26.3",
        "integration": "monorepo-fanout",
        "fanout": {
          "root_component": "github.com/acme/repo",
          "root_git_sha": "9dd3cf6a1b2c3d4e5f60718293a4b5c6d7e8f900",
          "paths": ["services/payments-api/*", ".github/workflows/ci.yml"],
          "matched": 3,
          "fingerprint": "3f1c9a04d7b25e68c1a04f9b2d6e7810"
        }
      },
      "findings": {
        "critical": 0,
        "high": 1,
        "medium": 2,
        "low": 0,
        "total": 3
      },
      "summary": {
        "has_critical": false,
        "has_high": true
      },
      "issues": [
        {
          "severity": "high",
          "rule": "java/sql-injection",
          "file": "services/payments-api/src/main/kotlin/com/acme/Payments.kt",
          "line": 88,
          "message": "Query built from user-controlled sources"
        }
      ]
    }
  }
