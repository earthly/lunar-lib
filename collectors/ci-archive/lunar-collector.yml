version: 0

name: ci-archive
description: Archive completed CI workflow runs and their logs to S3
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "CI Archive Collector"
  long_description: |
    Archives every CI workflow run for a commit — run metadata plus the full
    logs — into a single zip in S3, once all runs for that commit have
    finished. Gives you a durable record of CI output after the provider's
    own retention window closes.
  category: "ci-cd"
  icon: "assets/ci-archive.svg"
  status: "experimental"
  related:
    - slug: "ci-otel"
      type: "collector"
      reason: "Traces CI jobs live; ci-archive stores the finished run instead"

inputs:
  s3_bucket:
    description: Destination S3 bucket. The collector skips (exit 0) when unset.
  s3_prefix:
    description: Key prefix in the bucket. Objects land at <prefix>/<component>/<sha>/<timestamp>.zip; empty means the bucket root.
    default: "lunar/ci-archive"
  aws_region:
    description: Region of the bucket. Falls back to AWS_REGION, then to the region S3 reports for the bucket.
    default: ""
  s3_endpoint_url:
    description: Endpoint of an S3-compatible store (MinIO, Ceph). Requires the static AWS key secrets. Empty means AWS.
    default: ""
  max_archive_mb:
    description: Upload nothing and record an error if the archive would exceed this size.
    default: "512"
  include_runs_pattern:
    description: Only archive workflow runs whose name matches this regex. Empty means all runs.
    default: ""

secrets:
  GH_TOKEN:
    description: GitHub token with `actions:read`, to list workflow runs and download their logs
  AWS_ACCESS_KEY_ID:
    description: Optional static key. Used only when no IAM role resolves (IRSA, Pod Identity, ECS, instance profile), and always with s3_endpoint_url.
  AWS_SECRET_ACCESS_KEY:
    description: Optional, paired with AWS_ACCESS_KEY_ID.
  AWS_SESSION_TOKEN:
    description: Optional, for temporary static credentials.

collectors:
  - name: workflow-logs
    description: |
      Fires once every CI workflow run for the commit has completed — the
      doneness gate — then lists those runs, downloads each run's log archive,
      bundles them with a manifest into one zip, and uploads it to S3. Records
      the object URI and the run inventory under .ci.archive so a consumer can
      find the archive without guessing the key. Both hooks are declared on the
      same path so the collector fires whether or not .ci is populated —
      doneness is the trigger, the path is not a precondition.
    mainBash: workflow-logs.sh
    # Log archives for a busy repo can be hundreds of MB before compression.
    size: large
    hooks:
      - type: after-json
        path: .ci
      - type: missing-json
        path: .ci
    keywords: ["ci archive", "workflow logs", "s3", "after-json", "workflow-end", "retention", "audit trail"]

example_component_json: |
  {
    "ci": {
      "archive": {
        "uri": "s3://acme-ci-archive/lunar/ci-archive/github.com/acme/myproject/1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b/20260923T142203Z.zip",
        "bucket": "acme-ci-archive",
        "key": "lunar/ci-archive/github.com/acme/myproject/1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b/20260923T142203Z.zip",
        "size_bytes": 4823104,
        "run_count": 2,
        "runs": [
          {
            "id": 24322039765,
            "name": "ci",
            "path": ".github/workflows/ci.yml",
            "event": "push",
            "attempt": 1,
            "status": "completed",
            "conclusion": "success",
            "started_at": "2026-09-23T14:02:11Z",
