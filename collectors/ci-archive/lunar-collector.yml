version: 0

name: ci-archive
description: Archive completed CI workflow runs and their logs to S3
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "CI Archive Collector"
  long_description: |
    Archives each finished CI workflow run, re-runs included — run metadata,
    jobs and the full logs — to S3, and records where each one went. Gives you
    a durable record of CI output after the provider's own retention window
    closes.
  category: "ci-cd"
  icon: "assets/ci-archive.svg"
  status: "experimental"
  related:
    - slug: "ci-otel"
      type: "collector"
      reason: "Traces CI jobs live; ci-archive stores the finished run instead"

inputs:
  s3_bucket:
    description: Destination S3 bucket. The collector skips (exit 0) when unset.
  s3_prefix:
    description: Key prefix in the bucket. Objects land at <prefix>/<host>/<owner>/<repo>/<sha>/<run-id>-<attempt>.zip; empty means the bucket root.
    default: "lunar/ci-archive"
  aws_region:
    description: Region of the bucket. Falls back to AWS_REGION, then to the region S3 reports for the bucket.
    default: ""
  s3_endpoint_url:
    description: Endpoint of an S3-compatible store (MinIO, Ceph). Requires the static AWS key secrets. Empty means AWS.
    default: ""
  max_archive_mb:
    description: Upload nothing and fail the run if a run attempt's log archive is larger than this.
    default: "512"
  include_runs_pattern:
    description: Only archive runs of workflows whose name matches this regex. Empty means all workflows.
    default: ""

secrets:
  GH_TOKEN:
    description: GitHub token with `actions:read`, to list workflow runs and download their logs
  AWS_ACCESS_KEY_ID:
    description: Optional static key. Used only when no IAM role resolves (IRSA, Pod Identity, ECS, instance profile), and always with s3_endpoint_url.
  AWS_SECRET_ACCESS_KEY:
    description: Optional, paired with AWS_ACCESS_KEY_ID.
  AWS_SESSION_TOKEN:
    description: Optional, for temporary static credentials.

collectors:
  - name: workflow-logs
    description: |
      Fires once per finished CI workflow run attempt, re-runs included, on the
      Hub's workflow-end hook. Downloads that attempt's log archive, bundles it
      with the run and its jobs, uploads it to S3, and appends where it went to
      .ci.archive.runs.
    mainBash: workflow-logs.sh
    # Log archives for a busy repo can be hundreds of MB before compression.
    size: large
    hook:
      type: workflow-end
    keywords: ["ci archive", "workflow logs", "s3", "workflow-end", "retention", "audit trail"]

