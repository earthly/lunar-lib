          },
          {
            "id": 24322039912,
            "name": "codeql",
            "path": ".github/workflows/codeql.yml",
            "event": "push",
            "attempt": 1,
            "status": "completed",
            "conclusion": "failure",
            "started_at": "2026-09-23T14:02:12Z",
