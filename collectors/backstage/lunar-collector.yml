version: 0

name: backstage
description: Parse catalog-info.yaml for Backstage service catalog metadata
author: earthly
default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Backstage Collector"
  long_description: |
    Parses and lints Backstage catalog-info.yaml files. Writes the raw
    Backstage descriptor (apiVersion, kind, metadata, spec) to
    .catalog.native.backstage, preserving annotations as-is. Optionally
    verifies the referenced domain and system exist in a live catalog,
    via Bearer token or AWS SigV4.
  categories: ["service-catalog"]
  icon: "assets/backstage.svg"
  status: "beta"
  related:
    - slug: "backstage"
      type: "policy"
      reason: "Enforces Backstage catalog standards based on collected metadata"

collectors:
  - name: catalog-info
    description: |
      Scans the repository for a catalog-info.yaml file (configurable paths)
      and parses its contents as-is into `.catalog.native.backstage`
      (apiVersion, kind, metadata, spec). A file may declare multiple entities
      separated by `---` (e.g. a Component plus the APIs it provides); every
      entity is parsed and recorded under `.catalog.native.backstage.entities[]`,
      while the primary entity (the first Component, else the first document) is
      hoisted to the top level so the single-entity policies keep working.
      Annotations are preserved verbatim with their `backstage.io/` or vendor
      prefixes. Lints every entity for schema/syntax issues and writes the
      aggregated findings to `.catalog.native.backstage.valid` and
      `.catalog.native.backstage.errors[]`.
      When `backstage_url` is configured, it additionally performs a
      referential-integrity check: for each grouping reference declared in the
      file (`spec.domain`, `spec.system`) it queries the Backstage catalog API
      (`GET <api_path_prefix>/catalog/entities/by-name/<kind>/<namespace>/<name>`,
      where `api_path_prefix` defaults to `/api`; set `ref_lookup: by-query` to
      resolve via the `/catalog/entities/by-query` search endpoint instead, for
      an instance that only authorizes that one) and
      records the outcome under `.catalog.native.backstage.refs`. Whenever
      `backstage_url` is set the collector writes `.refs.checked: true` as the
      "referential integrity ran" signal, plus a per-reference entry: a
      definitive lookup records `.refs.<kind> = {name, exists}` (`exists: true`
      on a 200, `false` on a 404), while a transient failure (timeout/5xx)
      records `.refs.<kind> = {name, error}` so an outage stays distinguishable
      from a real miss. Because a Component has no domain of its own in the
      Backstage model — domain membership belongs to its System — a confirmed
      `spec.system` is followed one hop further: that System's own `spec.domain`
      is resolved and recorded at `.refs.system_domain = {name, exists,
      via_system}`, which is what makes the domain check meaningful for an
      ordinary `kind: Component` file. The hop reuses the System entity the
      system lookup already returned, so it costs one extra request and only
      when the system both resolves and declares a domain. The `<namespace>` is derived from the reference itself —
      a qualified ref (`ns/name`) carries its own, otherwise the component's own
      `metadata.namespace` is used, falling back to `default` — so no namespace
      configuration is required. When `backstage_url` is empty (the default) no
      lookups run and `.refs` is not written at all — behavior is identical to
      today, and the policy's referential-integrity checks skip (pass) rather
      than fail.
      Those lookups authenticate per `auth_mode`: a `BACKSTAGE_TOKEN` bearer
      header (default), or AWS SigV4 signing (`auth_mode: sigv4`) for a
      Backstage API fronted by AWS IAM auth, which rejects bearer tokens. An
      auth or credential-resolution failure never discards the parse and lint
      results — it is recorded as a per-reference `{name, error}` exactly like
      any other non-definitive lookup.
    mainBash: main.sh
    hook:
      type: code
    keywords: ["backstage", "catalog-info", "service catalog", "ownership", "lifecycle", "system", "lint", "referential integrity", "domain", "referential-integrity", "sigv4", "aws", "iam"]

inputs:
  paths:
    description: Comma-separated list of catalog file paths to check (first match wins)
    default: "catalog-info.yaml,catalog-info.yml"
  backstage_url:
    description: |
      Base URL of the Backstage instance (e.g. https://backstage.example.com).
      When set, the collector cross-checks each declared spec.domain and
      spec.system against the Backstage catalog API and records the result
      under `.catalog.native.backstage.refs`. Empty (the default) disables
      referential-integrity lookups — the collector only parses and lints the
      local file, exactly as before.
    default: ""
  api_path_prefix:
    description: |
      Path prefix prepended before `/catalog/entities` when calling the
      Backstage catalog API. Defaults to `/api`, matching the standard
      Backstage layout (`<backstage_url>/api/catalog/entities`). Set to an
      empty string (`""`) when the catalog API is mounted at the root — e.g.
      behind an API gateway that already strips the `/api` hop, where
      `<backstage_url>/catalog/entities` is the live endpoint and
      `/api/catalog/entities` returns 403/404. A leading slash is optional and
      any trailing slash is ignored (`api`, `/api`, `/api/` are equivalent).
      Especially relevant with `auth_mode: sigv4`: an IAM-fronted Backstage is
      usually behind Amazon API Gateway, which is exactly the deployment shape
      that strips the `/api` hop — so a correct SigV4 setup can still 403 on
      every lookup if this is left at the default.
    default: "/api"
  auth_mode:
    description: |
      How the collector authenticates to the Backstage catalog API. Only
      consulted when `backstage_url` is set.
      - `bearer` — send `Authorization: Bearer <BACKSTAGE_TOKEN>`. Default;
                   unchanged behavior.
      - `sigv4`  — sign every request with AWS Signature V4, for a Backstage
                   API fronted by AWS IAM auth (typically Amazon API Gateway),
                   which rejects Bearer tokens outright. Credentials are
                   resolved at runtime from the standard AWS credential chain
                   — IRSA (EKS), EKS Pod Identity / ECS task role, or EC2
                   instance profile — so they **auto-refresh and are never
                   supplied by hand**. See the README "AWS SigV4
                   Authentication" section for the (one-time) IAM-role setup.
    default: "bearer"
  aws_region:
    description: |
      AWS region used to scope the SigV4 signature and to reach STS when
      assuming a web-identity (IRSA) role. Required when `auth_mode: sigv4`,
      unless `AWS_REGION` is already present in the snippet pod's environment
      (IRSA and most AWS runtimes set it, but not always). If `auth_mode:
      sigv4` and neither this input nor the `AWS_REGION` env var is set, the
      referential-integrity lookups are skipped and each declared reference
      records an `aws_region required for sigv4` error, rather than signing
      with an empty region (which would surface as an opaque downstream AWS
      error). Parsing and linting still run. Ignored for `auth_mode: bearer`.
    default: ""
  aws_service:
    description: |
      AWS service name for the SigV4 signature scope. For a Backstage API
      behind Amazon API Gateway this is `execute-api` (the default). Override
      only for other fronting (e.g. a Lambda function URL signs as `lambda`).
      Ignored for `auth_mode: bearer`.
    default: "execute-api"
  ref_lookup:
    description: |
      Which catalog endpoint resolves each declared reference. Only consulted
      when `backstage_url` is set. Both modes produce an identical `.refs`
      shape, so switching requires no policy changes.
      - `by-name`  — `GET <api_path_prefix>/catalog/entities/by-name/<kind>/<namespace>/<name>`.
                     A direct key lookup whose HTTP status is the answer: 200 =
                     exists, 404 = miss. Default; unchanged behavior.
      - `by-query` — `GET <api_path_prefix>/catalog/entities/by-query?limit=1&filter=kind=<kind>,metadata.namespace=<namespace>,metadata.name=<name>`.
                     A catalog search, so existence comes from the body rather
                     than the status: a 200 whose `items` array is non-empty =
                     exists, an empty array = miss. Set this when the instance
                     only authorizes the search endpoint — a gateway in front
                     of Backstage can expose `by-query` while rejecting
                     `by-name` outright, in which case every lookup fails
                     however correct the auth is, and the resulting errors read
                     as an outage rather than a misconfiguration. It is the
                     same endpoint the Backstage *cataloger* uses, so an
                     instance the cataloger can already read supports it.
    default: "by-name"

secrets:
  BACKSTAGE_TOKEN:
    description: |
      Bearer token for the Backstage catalog API, sent as an
      `Authorization: Bearer` header. Used when `auth_mode: bearer` (the
      default). Only used when `backstage_url` is set; required if the
      Backstage instance needs authentication (many internal deployments do).
      Not used for `sigv4`.

  AWS_ACCESS_KEY_ID:
    description: |
      Optional, `auth_mode: sigv4` only. A static-credentials escape hatch
      for runners with **no** attached IAM identity (no IRSA / Pod Identity /
      ECS / EC2 role). Leave unset for role-based auth, which is the
      recommended path because it self-refreshes — static keys do **not**
      auto-rotate.

  AWS_SECRET_ACCESS_KEY:
    description: |
      Optional, `auth_mode: sigv4` only. Paired with `AWS_ACCESS_KEY_ID`
      for the static-credentials escape hatch (see that secret's note).

  AWS_SESSION_TOKEN:
    description: |
      Optional, `auth_mode: sigv4` only. Set alongside the static AWS keys
      when they are themselves temporary credentials. Because temporary keys
      expire, this path needs manual refresh — prefer role-based auth.

example_component_json: |
  {
    "catalog": {
      "native": {
        "backstage": {
          "valid": true,
          "errors": [],
          "path": "catalog-info.yaml",
          "apiVersion": "backstage.io/v1alpha1",
          "kind": "Component",
          "metadata": {
            "name": "payment-api",
            "description": "Payment processing API",
            "annotations": {
              "backstage.io/techdocs-ref": "dir:.",
              "pagerduty.com/integration-key": "PXXXXXX",
              "grafana/dashboard-selector": "https://grafana.example.com/d/abc123",
              "backstage.io/source-location": "url:https://github.com/acme/payment-api"
            },
            "tags": ["payments", "api", "tier1"]
          },
          "spec": {
            "type": "service",
            "owner": "team-payments",
            "lifecycle": "production",
            "domain": "payments",
            "system": "payment-platform",
            "providesApis": ["payment-api-grpc"],
            "consumesApis": ["user-api", "notification-api"],
            "dependsOn": ["resource:database-payments", "resource:cache-redis"]
          },
          "entities": [
            {
              "valid": true,
              "errors": [],
              "apiVersion": "backstage.io/v1alpha1",
              "kind": "Component",
              "metadata": {
                "name": "payment-api",
                "description": "Payment processing API",
                "annotations": {
                  "backstage.io/techdocs-ref": "dir:.",
                  "backstage.io/source-location": "url:https://github.com/acme/payment-api"
                },
                "tags": ["payments", "api", "tier1"]
              },
              "spec": {
                "type": "service",
                "owner": "team-payments",
                "lifecycle": "production",
                "domain": "payments",
                "system": "payment-platform",
                "providesApis": ["payment-api-grpc"],
                "consumesApis": ["user-api", "notification-api"],
                "dependsOn": ["resource:database-payments", "resource:cache-redis"]
              }
            },
            {
              "valid": true,
              "errors": [],
              "apiVersion": "backstage.io/v1alpha1",
              "kind": "API",
              "metadata": { "name": "payment-api-grpc" },
              "spec": {
                "type": "grpc",
                "owner": "team-payments",
                "lifecycle": "production"
              }
            }
          ],
          "refs": {
            "checked": true,
            "domain": { "name": "payments", "exists": true },
            "system": { "name": "payment-platform", "exists": true }
          }
        }
      }
    }
  }
