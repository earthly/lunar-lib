version: 0

name: backstage
description: Parse catalog-info.yaml for Backstage service catalog metadata
author: earthly
default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "Backstage Collector"
  long_description: |
    Parses and lints Backstage catalog-info.yaml, writing the raw
    descriptor to .catalog.native.backstage with annotations preserved.
    Optionally verifies the referenced domain and system exist in a live
    catalog, and resolves entity-reference tags on infrastructure into
    .catalog.entity_refs.
  categories: ["service-catalog"]
  icon: "assets/backstage.svg"
  status: "beta"
  related:
    - slug: "backstage"
      type: "policy"
      reason: "Enforces Backstage catalog standards based on collected metadata"
    - slug: "terraform"
      type: "collector"
      reason: "Records the infrastructure resource tags that entity-refs resolves"

collectors:
  - name: catalog-info
    description: |
      Scans the repository for a catalog-info.yaml file (configurable paths)
      and parses its contents as-is into `.catalog.native.backstage`
      (apiVersion, kind, metadata, spec). A file may declare multiple entities
      separated by `---` (e.g. a Component plus the APIs it provides); every
      entity is parsed and recorded under `.catalog.native.backstage.entities[]`,
      while the primary entity (the first Component, else the first document) is
      hoisted to the top level so the single-entity policies keep working.
      Annotations are preserved verbatim with their `backstage.io/` or vendor
      prefixes. Lints every entity for schema/syntax issues and writes the
      aggregated findings to `.catalog.native.backstage.valid` and
      `.catalog.native.backstage.errors[]`.
      When `backstage_url` is configured, it additionally performs a
      referential-integrity check: for each grouping reference declared in the
      file (`spec.domain`, `spec.system`) it queries the Backstage catalog API
      (`GET /api/catalog/entities/by-name/<kind>/<namespace>/<name>`) and
      records the outcome under `.catalog.native.backstage.refs`. Whenever
      `backstage_url` is set the collector writes `.refs.checked: true` as the
      "referential integrity ran" signal, plus a per-reference entry: a
      definitive lookup records `.refs.<kind> = {name, exists}` (`exists: true`
      on a 200, `false` on a 404), while a transient failure (timeout/5xx)
      records `.refs.<kind> = {name, error}` so an outage stays distinguishable
      from a real miss. The `<namespace>` is derived from the reference itself —
      a qualified ref (`ns/name`) carries its own, otherwise the component's own
      `metadata.namespace` is used, falling back to `default` — so no namespace
      configuration is required. When `backstage_url` is empty (the default) no
      lookups run and `.refs` is not written at all — behavior is identical to
      today, and the policy's referential-integrity checks skip (pass) rather
      than fail.
    mainBash: main.sh
    hook:
      type: code
    keywords: ["backstage", "catalog-info", "service catalog", "ownership", "lifecycle", "system", "lint", "referential integrity", "domain", "referential-integrity"]

  - name: entity-refs
    description: |
      Resolves Backstage entity references that other collectors recorded as
      infrastructure resource tags. Fires via the `after-json` hook once
      `.iac.modules` is present, reads the merged Component JSON with
      `lunar component get-json`, and collects every distinct concrete value of
      the `entity_ref_tag_key` tag across `.iac.modules[].resources[].tags` and
      `.iac.modules[].default_tags`. Each distinct value is resolved against the
      Backstage catalog API
      (`GET /api/catalog/entities/by-name/<kind>/<namespace>/<name>`) and the
      outcome is written to `.catalog.entity_refs`. This is the Backstage-specific
      half of resource tagging: the `terraform` collector records tags generically
      and knows nothing of Backstage; this sub-collector assigns the meaning.
      `.catalog.entity_refs.checked: true` is the "resolution ran" signal, so a
      policy can distinguish "configured" from "not configured". Each ref records
      `{name, exists}` on a definitive 200/404, or `{name, error}` on a transient
      failure (timeout/5xx) so an outage stays distinguishable from a real miss;
      `resources` lists the `<type>.<name>` resources carrying that ref so a
      policy can attribute a failure. Values that are unresolved Terraform
      expressions (`${var.x}`) are skipped — there is nothing concrete to resolve
      — and reported under `unresolved`. Requires `backstage_url`; when it is
      unset (the default) this sub-collector writes nothing. Note it writes
      `.catalog.entity_refs`, deliberately NOT `.catalog.native.backstage`, whose
      presence is the "catalog-info.yaml exists" signal for several policies.
    mainBash: entity_refs.sh
    hook:
      type: after-json
      path: .iac.modules
    keywords: ["backstage", "entity_ref", "referential integrity", "service catalog", "after-json", "terraform", "tags", "iac"]

inputs:
  paths:
    description: Comma-separated list of catalog file paths to check (first match wins)
    default: "catalog-info.yaml,catalog-info.yml"
  backstage_url:
    description: |
      Base URL of the Backstage instance (e.g. https://backstage.example.com).
      When set, `catalog-info` cross-checks each declared spec.domain and
      spec.system against the Backstage catalog API and records the result
      under `.catalog.native.backstage.refs`, and `entity-refs` resolves the
      entity-reference tags found on infrastructure resources into
      `.catalog.entity_refs`. Empty (the default) disables all catalog lookups —
      `catalog-info` only parses and lints the local file, exactly as before, and
      `entity-refs` writes nothing.
    default: ""
  entity_ref_tag_key:
    description: |
      The infrastructure resource tag key whose value the `entity-refs`
      sub-collector treats as a Backstage entity reference (of the form
      `[<kind>:][<namespace>/]<name>`). Read from the tags recorded by an IaC
      collector at `.iac.modules[].resources[].tags` and
      `.iac.modules[].default_tags`. Only used when `backstage_url` is set.
    default: "backstage.com/entity_ref"

secrets:
  BACKSTAGE_TOKEN:
    description: |
      Bearer token for the Backstage catalog API, sent as an
      `Authorization: Bearer` header. Only used when `backstage_url` is set;
      required if the Backstage instance needs authentication (many internal
      deployments do).

example_component_json: |
  {
    "catalog": {
      "native": {
        "backstage": {
          "valid": true,
          "errors": [],
          "path": "catalog-info.yaml",
          "apiVersion": "backstage.io/v1alpha1",
          "kind": "Component",
          "metadata": {
            "name": "payment-api",
            "description": "Payment processing API",
            "annotations": {
              "backstage.io/techdocs-ref": "dir:.",
              "pagerduty.com/integration-key": "PXXXXXX",
              "grafana/dashboard-selector": "https://grafana.example.com/d/abc123",
              "backstage.io/source-location": "url:https://github.com/acme/payment-api"
            },
            "tags": ["payments", "api", "tier1"]
          },
          "spec": {
            "type": "service",
            "owner": "team-payments",
            "lifecycle": "production",
            "domain": "payments",
            "system": "payment-platform",
            "providesApis": ["payment-api-grpc"],
            "consumesApis": ["user-api", "notification-api"],
            "dependsOn": ["resource:database-payments", "resource:cache-redis"]
          },
          "entities": [
            {
              "valid": true,
              "errors": [],
              "apiVersion": "backstage.io/v1alpha1",
              "kind": "Component",
              "metadata": {
                "name": "payment-api",
                "description": "Payment processing API",
                "annotations": {
                  "backstage.io/techdocs-ref": "dir:.",
                  "backstage.io/source-location": "url:https://github.com/acme/payment-api"
                },
                "tags": ["payments", "api", "tier1"]
              },
              "spec": {
                "type": "service",
                "owner": "team-payments",
                "lifecycle": "production",
                "domain": "payments",
                "system": "payment-platform",
                "providesApis": ["payment-api-grpc"],
                "consumesApis": ["user-api", "notification-api"],
                "dependsOn": ["resource:database-payments", "resource:cache-redis"]
              }
            },
            {
              "valid": true,
              "errors": [],
              "apiVersion": "backstage.io/v1alpha1",
              "kind": "API",
              "metadata": { "name": "payment-api-grpc" },
              "spec": {
                "type": "grpc",
                "owner": "team-payments",
                "lifecycle": "production"
              }
            }
          ],
          "refs": {
            "checked": true,
            "domain": { "name": "payments", "exists": true },
            "system": { "name": "payment-platform", "exists": true }
          }
        }
      },
      "entity_refs": {
        "checked": true,
        "source": { "tool": "backstage", "integration": "api" },
        "refs": [
          {
            "name": "component:default/payment-api",
            "exists": true,
            "resources": ["aws_db_instance.main", "aws_s3_bucket.logs"]
          },
          {
            "name": "component:default/legacy-svc",
            "exists": false,
            "resources": ["aws_instance.web"]
          }
        ],
        "unresolved": [
          { "value": "${var.entity_ref}", "resources": ["aws_sqs_queue.jobs"] }
        ]
      }
    }
  }
