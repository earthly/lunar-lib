version: 0

name: codeql
description: Detects CodeQL security scans via GitHub Code Scanning or CLI integration
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main
default_image_ci_collectors: native

landing_page:
  display_name: "CodeQL Collector"
  long_description: |
    Detects GitHub CodeQL security scanning via GitHub Code Scanning check-runs
    or CLI integration in CI pipelines. Writes to normalized SAST Component JSON
    paths, enabling tool-agnostic SAST policies.
  category: "security"
  icon: "assets/codeql.svg"
  status: "beta"
  related:
    - slug: "sast"
      type: "policy"
      reason: "Enforces SAST standards using CodeQL scan data"

collectors:
  - name: github-app
    description: |
      Detects CodeQL scans on pull requests by querying GitHub check-runs API
      for the github-advanced-security app. Waits for scan completion and captures
      check status, conclusion, and URLs.
    mainBash: github-app.sh
    hook:
      type: code
    keywords: ["codeql", "github code scanning", "sast", "code analysis", "security"]

  - name: running-in-prs
    description: |
      Proves CodeQL is running on PRs by querying Lunar Hub for CodeQL data
      from recent PRs. Used on the default branch to provide compliance proof
      that PR scanning is happening.
    mainBash: running-in-prs.sh
    hook:
      type: code
    keywords: ["codeql", "pr scanning", "compliance proof", "default branch"]

  - name: cicd
    description: |
      Detects CodeQL CLI or legacy codeql-runner executions in CI pipelines.
      Captures command metadata and, when the SARIF output file is available
      on disk (from codeql database analyze/interpret-results), collects the
      raw SARIF and normalizes findings into .sast.findings and .sast.issues.
    mainBash: cli.sh
    hooks:
      - type: ci-after-command
        binary:
          name: codeql
      - type: ci-after-command
        binary:
          name: codeql-runner
    keywords: ["codeql cli", "codeql-runner", "ci integration", "sast", "code scanning"]

  - name: monorepo-fanout
    description: |
      Redistributes a monorepo's repo-wide CodeQL findings to its subcomponents.
      CodeQL analyses a whole repository, and the traced scan resolves to the
      repository, so in a monorepo the findings land on the repo-root component
      while the real components are the subdirectories — every one of which then
      reads as "No SAST scanning data found" despite having been scanned.
      Enabled on the repository ROOT alongside `cicd`, this runs once the root's
      collection settles and writes each subcomponent's severity counts onto that
      subcomponent's Component JSON at the same commit. `.sast.native` is never
      copied — the raw SARIF describes the whole repository, so it stays on the
      root and each subcomponent gets only the derived numbers its policies read,
      plus provenance under `.sast.source.fanout`. Subcomponents are discovered
      with a prefix-scoped query against the Hub's SQL API, so only the matching
      rows cross the wire rather than the entire catalog. A finding is attributed
      to a subcomponent when its file matches that subcomponent's path patterns —
      the explicit `paths:` plus the implicit "<subdir>/*" its name implies — so
      attribution follows the same rule the Hub uses for change detection.
      Findings matching no subcomponent stay on the root, and a subcomponent that
      already has SAST data of its own is never overwritten. Hooked on
      .sast.issues rather than .sast because cli.sh writes
      .sast.native.codeql.cicd for every codeql exec (database init, resolve
      languages, bundle, cleanup), so .sast is present long before any findings
      are; .sast.issues appears only once a SARIF report has been parsed. The
      root component also needs at least one POLICY: an after-json collector is
      dispatched by the Hub's doneness gate, which is only consulted while
      bundling a component's policies, so a component no policy evaluates never
      fires them.
    mainBash: monorepo-fanout.sh
    hook:
      type: after-json
      path: .sast.issues
    keywords: ["monorepo", "sast", "fan-out", "after-json", "subcomponent", "cross-component"]

inputs:
  include_issues:
    description: |
      Also write the per-finding array (`.sast.issues`) to each subcomponent,
      sliced to the findings that component owns. Off by default: `policies/sast`
      reads `.sast.summary.has_<sev>` and `.sast.findings.<sev>`, and `max-total`
      reads `.sast.findings.total` — none of them read `.sast.issues`, so
      shipping it multiplies write size by findings x subcomponents for data no
      guardrail evaluates. Turn it on if you want the per-finding detail visible
      on each service in the UI. Only used by `monorepo-fanout`.
    default: "false"
  subcomponents:
    description: |
      Comma-separated list of subcomponent names for `monorepo-fanout` to write
      to, e.g. "github.com/acme/repo/services/api,github.com/acme/repo/services/web".
      Skips SQL discovery entirely — useful when collectors cannot reach the
      Hub's SQL API, or to restrict the fan-out to a subset. Default (empty)
      discovers every component whose name is prefixed by the root's.
      NOTE: it also skips reading each target's explicit `paths:`. Attribution
      then falls back to the implicit "<subdir>/*" a component's name implies, so
      a subcomponent that claims files outside its own directory (a shared
      `.github/workflows/ci.yml`, a root `CODEOWNERS`) will NOT receive findings
      from them. Prefer automatic discovery unless you have a reason not to.
    default: ""
  read_retry_seconds:
    description: |
      How long `monorepo-fanout` keeps retrying its Hub reads before failing the
      run, in seconds. The after-json wave fires when COLLECTION settles, but
      `lunar component get-json` reads through views over `mat.components` /
      `mat.component_json`, which the Hub drains asynchronously. A SHA-pinned
      read therefore returns NotFound until this commit's row has drained —
      measured at 285s on a busy Hub. Raise it if your Hub materializes slowly;
      the run holds a wave slot while it waits. On expiry the collector exits
      non-zero rather than silently writing nothing, because the wave is
      fire-once and a swallowed read loses that commit's fan-out permanently.
    default: "300"
  max_subcomponents:
    description: |
      Upper bound on how many subcomponents `monorepo-fanout` will write to in a
      single run, as a guard against a mis-scoped root component fanning out
      across an entire org. Targets beyond the limit are skipped and logged as a
      warning (never silently dropped).
    default: "50"

secrets:
  GH_TOKEN:
    description: GitHub token for API access (required for github-app collector)

example_component_json: |
  {
    "sast": {
      "running_in_prs": true,
      "source": {
        "tool": "codeql",
        "version": "2.16.0",
        "integration": "ci"
      },
      "findings": {
        "critical": 0,
        "high": 1,
        "medium": 3,
        "low": 0,
        "total": 4
      },
      "issues": [
        {
          "severity": "high",
          "rule": "go/sql-injection",
          "file": "db/query.go",
          "line": 42,
          "message": "Unsanitized input used in SQL query"
        }
      ],
      "summary": {
        "has_critical": false,
        "has_high": true
      },
      "native": {
        "codeql": {
          "github_app": {
            "id": 12345,
            "name": "CodeQL",
            "status": "completed",
            "conclusion": "success"
          },
          "cicd": {
            "cmds": [
              {"cmd": "codeql database interpret-results --format=sarif-latest --output=../results/go.sarif", "version": "2.16.0"}
            ]
          },
          "sarif": {}
        }
      }
    }
  }
