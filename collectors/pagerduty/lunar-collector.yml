version: 0

name: pagerduty
description: Collect on-call schedule and escalation data from PagerDuty
author: support@earthly.dev

default_image: earthly/lunar-lib:base-main

landing_page:
  display_name: "PagerDuty Collector"
  long_description: |
    Query the PagerDuty API to collect on-call schedule, escalation policy,
    and current responder data. Normalizes results into the .oncall category
    for tool-agnostic policy evaluation. Can find each component's service
    in Backstage, including one declared on its System or Domain.
  categories: ["incident-management"]
  icon: "assets/pagerduty.svg"
  status: "beta"
  related:
    - slug: "oncall"
      type: "policy"
      reason: "Enforces on-call schedule, escalation, and staffing standards"
    - slug: "backstage"
      type: "collector"
      reason: "Its live catalog lookup supplies service IDs for backstage_discovery: live"

collectors:
  - name: oncall
    description: |
      Queries the PagerDuty REST API for the component's service on a code hook
      — it runs when commits are pushed (PRs and the default branch). Resolves
      the service ID in order: the component's `pagerduty/service-id` meta
      annotation (set by a cataloger via
      `lunar catalog component --meta pagerduty/service-id <id>`), then the
      explicit service_id input, then — with `backstage_discovery: "true"` —
      the component's own `catalog-info.yaml` from the checkout. With
      `backstage_discovery: live` it leaves components that need Backstage to
      the `backstage` sub-collector. Records where the ID came from at
      .oncall.service.discovered_via. Fetches service details, on-call schedule
      participants, and escalation policy. Writes normalized data to
      .oncall.service, .oncall.schedule, .oncall.escalation, and
      .oncall.summary, and the raw API responses under .oncall.native.pagerduty.
      When every source answered and none maps the component, writes
      .oncall.unmapped with the places it looked instead.
    mainBash: oncall.sh
    hook:
      type: code
    keywords: ["pagerduty", "oncall", "escalation", "incident management", "on-call schedule", "service mapping"]

  - name: oncall-cron
    description: |
      Same PagerDuty query as `oncall`, but on a daily cron instead of on push —
      it re-collects on a schedule so `.oncall` stays fresh as on-call schedules
      and escalation policies rotate between commits (they change on their own
      clock, independent of code). Resolves the service ID identically, except
      that with `backstage_discovery: live` it reads the backstage collector's
      lookup from the default branch's Component JSON. Writes the same
      normalized .oncall.service, .oncall.schedule, .oncall.escalation, and
      .oncall.summary (raw responses under .oncall.native.pagerduty).
      `clone-code` gives it the checkout so `backstage_discovery: "true"` can
      read `catalog-info.yaml`. Include `oncall` for on-push evaluation,
      `oncall-cron` for always-fresh scheduled refresh, or both.
    mainBash: oncall.sh
    hook:
      type: cron
      # Daily at 04:00 UTC (9pm PDT / 8pm PST the previous day). Deliberately
      # staggered off 02:00 UTC, where the cataloger wave and the trivy/grype
      # SCA re-scans already land, and off 03:00 UTC (the container re-scans +
      # catalog-info catalogers) — spreads external-API load instead of piling
      # every scheduled job onto one tick.
      schedule: "0 4 * * *"
      clone-code: true       # checkout lets backstage_discovery read catalog-info.yaml locally
    keywords: ["pagerduty", "oncall", "escalation", "incident management", "on-call schedule", "cron", "scheduled"]

  - name: backstage
    description: |
      With `backstage_discovery: live`, finds the component's PagerDuty
      service in what the backstage collector read from the live catalog, so
      only the backstage collector calls Backstage. Runs once that lookup
      (.catalog.native.backstage.refs.entity) lands in the Component JSON, and
      reads the service ID off the component's own entity, else its System,
      else that System's Domain, else the catalog file. Retries the read for up
      to `backstage_wait_seconds` while the Component JSON catches up, then
      queries PagerDuty and writes .oncall like `oncall`. Needs the backstage
      collector with `backstage_url` set.
    mainBash: backstage.sh
    hook:
      type: after-json
      path: .catalog.native.backstage.refs.entity
    keywords: ["pagerduty", "oncall", "backstage", "service mapping", "service-id", "after-json", "inherited annotations"]

inputs:
  service_id:
    description: >
      PagerDuty service ID to query (e.g. PXXXXXX). Optional if the component
      has a `pagerduty/service-id` meta annotation set by a cataloger.
    default: ""
  pagerduty_base_url:
    description: PagerDuty API base URL
    default: "https://api.pagerduty.com"
  backstage_discovery:
    description: >
      Where to find the service ID when component meta and the service_id
      input don't give one. "false": nowhere. "true": the annotations in the
      component's checked-out catalog-info.yaml. "live": the backstage
      collector's lookup in the live catalog, which covers an ID inherited from
      the component's System or Domain; needs the backstage collector with
      backstage_url set, and the `backstage` sub-collector.
    default: "false"
  backstage_annotations:
    description: >
      Comma-separated annotation keys to read the service ID from, tried in
      order (first non-empty value wins). Defaults to both conventional
      spellings — PagerDuty's Backstage integration guide uses
      `pagerduty.com/service-id`; Lunar's meta uses `pagerduty/service-id`.
      Used when backstage_discovery is "true" or "live".
    default: "pagerduty.com/service-id,pagerduty/service-id"
  backstage_catalog_paths:
    description: >
      Comma-separated catalog-info file paths to try in the checked-out repo
      (first match wins). Only used when backstage_discovery is "true".
    default: "catalog-info.yaml,catalog-info.yml"
  backstage_wait_seconds:
    description: >
      How long the `backstage` sub-collector keeps retrying the read of the
      backstage collector's lookup before it fails the run. The Component JSON
      it reads can lag the write that triggered it by several minutes.
    default: "1800"

secrets:
  PAGERDUTY_API_KEY:
    description: PagerDuty REST API key (read-only token with service and oncall scopes)

example_component_json: |
  {
    "oncall": {
      "source": {
        "tool": "pagerduty",
        "integration": "api"
      },
      "service": {
        "id": "PXXXXXX",
        "name": "Payment API",
        "status": "active",
        "discovered_via": "system:default/payment-platform"
      },
      "schedule": {
        "exists": true,
        "participants": 4,
        "rotation": "weekly"
      },
      "escalation": {
        "exists": true,
        "levels": 3,
        "policy_name": "Payment API Escalation"
      },
      "summary": {
        "has_oncall": true,
        "has_escalation": true,
        "min_participants": 4
      },
      "native": {
        "pagerduty": { "...full PagerDuty API response..." }
      }
    }
  }
